# The public spectator instance. The judged deployment is meant to run on a Sprite; this
# machine exists so a judge can drive the ladder without waiting for credentials, and every
# page says so.
app = "codicil-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO = "1"
  PORT = "8080"
  DATA_DIR = "/data"
  LLM_PROVIDER = "none"
  # Set DEMO_REPO / DEMO_SLACK as secrets-free env once the connectors exist, e.g.
  # DEMO_REPO = "memeshee/codicil-demo"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
