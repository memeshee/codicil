# The public spectator instance. The judged deployment is meant to run on a Sprite; this
# machine exists so a judge can drive the ladder without waiting for credentials, and every
# page says so.
app = "codicil-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO = "1"
  PORT = "8080"
  DATA_DIR = "/data"
  LLM_PROVIDER = "none"
  # Set DEMO_REPO / DEMO_SLACK as secrets-free env once the connectors exist, e.g.
  # DEMO_REPO = "memeshee/codicil-demo"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: this is a public demo nobody is paying for. Suspend resumes from a memory
  # snapshot in about a second, which is the difference between "waking" and "broken" for a
  # judge who lands cold. auto_start brings it back on the first request.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# One gigabyte, so a stopped or suspended machine does not lose the demo's will and its
# hash-chained board. Without this, a cold start came back with an empty database - which
# looked like the product forgetting, in a product whose whole claim is that it does not.
[[mounts]]
  source = "codicil_data"
  destination = "/data"
